# ===============================
# DATABASE CONFIGURATION
# ===============================
# Sửa lại tên database 'uniadmission_db' nếu bạn đặt tên khác
spring.datasource.url=jdbc:mysql://localhost:3306/uniadmission_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=@Vietanhcr11

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# ddl-auto=update giúp Spring Boot tự động tạo/cập nhật bảng trong MySQL dựa trên code Java
spring.jpa.hibernate.ddl-auto=update
# Hiển thị câu lệnh SQL trên console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
