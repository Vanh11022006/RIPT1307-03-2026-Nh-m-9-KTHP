spring.datasource.url=jdbc:h2:mem:uniadmission-test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.mail.username=test@uniadmission.local
app.frontend.base-url=http://localhost:5173
app.mail.from=test@uniadmission.local
app.jwt.secret=test-jwt-secret-for-integration-tests-32-bytes
app.admin.password=test-admin-password
